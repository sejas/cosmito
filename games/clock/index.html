<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tell the Time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕐</text></svg>" />
  <link rel="stylesheet" href="../../shared/base.css" />
  <link rel="stylesheet" href="../../shared/mascot.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="sky" aria-hidden="true">
    <span class="cloud c1"></span><span class="cloud c2"></span><span class="cloud c3"></span>
  </div>

  <!-- HOME -->
  <section id="home" class="screen active">
    <header class="top">
      <a class="round-btn" href="../../index.html" data-i18n-aria="hub">🏠</a>
      <h1 class="logo">
        <span class="l1" data-i18n="logo1"></span>
        <span class="l2" data-i18n="logo2"></span>
        <span class="l3" id="logoName"></span>
      </h1>
      <div class="settings">
        <button class="chip" id="btnSound" type="button"></button>
        <button class="chip" id="btnBuddy" type="button"></button>
        <button class="chip" id="btnLang" type="button"></button>
      </div>
    </header>

    <div class="hero">
      <div class="mascot-wrap big" id="mascotHome">
        <div class="bubble" id="bubbleHome" aria-live="polite"></div>
      </div>
      <div class="card total-card">
        <div class="total-label" data-i18n="totalStars"></div>
        <div class="total-num"><span id="totalStars">0</span> / <span id="maxStars">0</span> <span aria-hidden="true">⭐</span></div>
        <div class="total-bar" aria-hidden="true"><div id="totalFill"></div></div>
      </div>
    </div>

    <h2 class="pick" data-i18n="pickLevel"></h2>
    <div class="levels" id="levels"></div>

    <div class="card modes">
      <div class="modes-title" id="levelTitle"></div>
      <div class="mode-grid" id="modes"></div>
      <button class="btn explore-btn" id="btnExplore" type="button"><span aria-hidden="true">🧸</span> <span data-i18n="explore"></span></button>
    </div>
  </section>

  <!-- PLAY (read, set, digital, day, free play) -->
  <section id="play" class="screen">
    <header class="top game-top">
      <button class="round-btn" id="btnBack" type="button" data-i18n-aria="back">⬅️</button>
      <div class="game-title" id="playTitle"></div>
      <button class="round-btn" id="btnSpeak" type="button" data-i18n-aria="readAloud">🗣️</button>
    </header>
    <div class="dots" id="dots" role="progressbar" aria-valuemin="0"></div>

    <div class="play-main" id="playMain">
      <div class="card scene" id="scene" hidden>
        <div class="sky-box" id="skyBox" aria-hidden="true">
          <span class="stars-bg"></span>
          <span class="orb" id="orb"></span>
          <span class="hill"></span>
          <div class="scene-art">
            <div class="mascot-wrap scene-mascot" id="mascotScene"></div>
            <span class="scene-emoji" id="sceneEmoji"></span>
          </div>
        </div>
        <div class="scene-text">
          <div class="scene-line" id="sceneLine"></div>
          <div class="scene-task" id="sceneTask" aria-live="polite"></div>
        </div>
      </div>

      <div class="prompt card" id="prompt">
        <div class="prompt-q" id="promptQ"></div>
        <div class="prompt-big" id="promptBig" aria-live="polite"></div>
      </div>

      <div class="clock-area" id="clockArea">
        <div class="clock-card card" id="clockCard">
          <div class="clock-holder" id="clockHolder"></div>
          <div class="readout" id="readout" aria-live="polite" hidden>
            <span class="lcd" id="readDigital"></span>
            <span class="read-words" id="readWords"></span>
          </div>
        </div>
      </div>

      <div class="panel" id="panel">
        <div class="controls" id="controls" hidden>
          <div class="ctl-group ctl-h">
            <button class="ctl" type="button" data-part="h" data-dir="-1">−</button>
            <span class="ctl-label"><span class="swatch" aria-hidden="true"></span><span data-i18n="hours"></span></span>
            <button class="ctl" type="button" data-part="h" data-dir="1">+</button>
          </div>
          <div class="ctl-group ctl-m" id="ctlMinutes">
            <button class="ctl" type="button" data-part="m" data-dir="-1">−</button>
            <span class="ctl-label"><span class="swatch" aria-hidden="true"></span><span data-i18n="minutes"></span></span>
            <button class="ctl" type="button" data-part="m" data-dir="1">+</button>
          </div>
        </div>
        <div class="options" id="options"></div>
        <div class="feedback" id="feedback" aria-live="polite"></div>
        <div class="actions">
          <button class="btn primary check" id="btnCheck" type="button" data-i18n="check" hidden></button>
          <button class="btn primary got-it" id="btnGotIt" type="button" hidden></button>
        </div>
      </div>
    </div>

    <div class="mascot-wrap small corner" id="mascotPlay">
      <div class="bubble" id="bubblePlay"></div>
    </div>
  </section>

  <!-- RESULTS -->
  <section id="results" class="screen">
    <div class="result-card card">
      <div class="mascot-wrap big" id="mascotResult">
        <div class="bubble" id="bubbleResult"></div>
      </div>
      <div class="big-stars" id="bigStars" role="img">
        <span>★</span><span>★</span><span>★</span>
      </div>
      <div class="result-line" id="resultLine" aria-live="polite"></div>
      <div class="result-sub" id="resultSub"></div>
      <div class="result-actions">
        <button class="btn primary" id="btnAgain" type="button" data-i18n="playAgain"></button>
        <button class="btn" id="btnNextLevel" type="button" hidden></button>
        <button class="btn" id="btnMenu" type="button" data-i18n="menu"></button>
      </div>
    </div>
  </section>

  <script src="../../shared/storage.js"></script>
  <script src="../../shared/i18n.js"></script>
  <script src="../../shared/audio.js"></script>
  <script src="../../shared/fx.js"></script>
  <script src="../../shared/mascot.js"></script>
  <script src="../../shared/mascots/pipo.js"></script>
  <script src="../../shared/mascots/bollo.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/time.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
