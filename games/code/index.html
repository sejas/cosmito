<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Code</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧩</text></svg>" />
  <link rel="stylesheet" href="../../shared/base.css" />
  <link rel="stylesheet" href="../../shared/mascot.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="sky" aria-hidden="true">
    <span class="cloud c1"></span><span class="cloud c2"></span><span class="cloud c3"></span>
  </div>

  <!-- MAP -->
  <section id="home" class="screen active">
    <header class="top">
      <a class="round-btn" href="../../index.html" data-i18n-aria="hub">🏠</a>
      <h1 class="logo">
        <span class="l1" data-i18n="logo1"></span>
        <span class="l2" data-i18n="logo2"></span>
        <span class="l3" id="logoName"></span>
      </h1>
      <div class="settings">
        <button class="chip" id="btnSound" type="button"></button>
        <button class="chip" id="btnBuddy" type="button"></button>
        <button class="chip" id="btnLang" type="button"></button>
      </div>
    </header>

    <div class="hero">
      <div class="mascot-wrap big" id="mascotHome">
        <div class="bubble" id="bubbleHome" aria-live="polite"></div>
      </div>
      <div class="card total-card">
        <div class="total-label" data-i18n="totalStars"></div>
        <div class="total-num"><span id="totalStars">0</span> / <span id="maxStars">0</span> <span aria-hidden="true">⭐</span></div>
        <div class="total-bar" aria-hidden="true"><div id="totalFill"></div></div>
      </div>
    </div>

    <div class="worlds" id="worlds"></div>
  </section>

  <!-- PLAY -->
  <section id="play" class="screen">
    <header class="top play-top">
      <button class="round-btn" id="btnBack" type="button" data-i18n-aria="back">⬅️</button>
      <div class="play-title" id="playTitle"></div>
      <button class="round-btn" id="btnHint" type="button" data-i18n-aria="hint">💡</button>
    </header>

    <div class="play-main">
      <div class="card board-card">
        <div class="board-wrap" id="boardWrap">
          <div class="board" id="board" role="img"></div>
          <div class="walker" id="walker" aria-hidden="true"><div class="walker-body" id="walkerBody"><div class="walker-mascot" id="walkerMascot"></div></div></div>
          <div class="say" id="say" aria-hidden="true"></div>
        </div>
      </div>

      <div class="card code-card" id="codeCard">
        <div class="palette" id="palette" role="group" data-i18n-aria="palette"></div>
        <div class="program-wrap">
          <div class="meter" id="meter" role="status"></div>
          <div class="program" id="program" role="group" data-i18n-aria="program"></div>
        </div>
        <div class="controls">
          <button class="ctl" id="btnUndo" type="button" data-i18n-aria="undo"><span aria-hidden="true">↩️</span></button>
          <button class="ctl" id="btnClear" type="button" data-i18n-aria="clear"><span aria-hidden="true">🗑️</span></button>
          <button class="ctl stop" id="btnStop" type="button" data-i18n-aria="stop" hidden><span aria-hidden="true">⏹</span></button>
          <button class="ctl" id="btnSpeed" type="button"></button>
          <button class="ctl" id="btnStep" type="button" data-i18n-aria="step"><span aria-hidden="true">👣</span></button>
          <button class="run" id="btnRun" type="button" data-i18n-aria="run"><span aria-hidden="true" id="runIcon">▶</span></button>
        </div>
      </div>
    </div>
    <div class="sr-only" id="live" aria-live="polite"></div>
  </section>

  <!-- WIN -->
  <div class="win" id="win" role="dialog" aria-modal="true" aria-labelledby="winTitle" hidden>
    <div class="card win-card">
      <div class="mascot-wrap big" id="mascotWin">
        <div class="bubble" id="bubbleWin"></div>
      </div>
      <h2 class="win-title" id="winTitle" data-i18n="winTitle"></h2>
      <div class="big-stars" id="bigStars" role="img"><span>★</span><span>★</span><span>★</span></div>
      <div class="win-line" id="winLine"></div>
      <div class="win-actions">
        <button class="btn" id="btnReplay" type="button"><span aria-hidden="true">↺</span> <span data-i18n="replay"></span></button>
        <button class="btn" id="btnMap" type="button"><span aria-hidden="true">🗺️</span> <span data-i18n="map"></span></button>
        <button class="btn primary" id="btnNext" type="button"><span data-i18n="next"></span> <span aria-hidden="true">▶</span></button>
      </div>
    </div>
  </div>

  <script src="../../shared/storage.js"></script>
  <script src="../../shared/i18n.js"></script>
  <script src="../../shared/audio.js"></script>
  <script src="../../shared/fx.js"></script>
  <script src="../../shared/mascot.js"></script>
  <script src="../../shared/mascots/pipo.js"></script>
  <script src="../../shared/mascots/bollo.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
