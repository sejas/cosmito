<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Times Tables</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔢</text></svg>" />
  <link rel="stylesheet" href="../../shared/base.css" />
  <link rel="stylesheet" href="../../shared/mascot.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="sky" aria-hidden="true">
    <span class="cloud c1"></span><span class="cloud c2"></span><span class="cloud c3"></span>
  </div>

  <!-- HOME -->
  <section id="home" class="screen active">
    <header class="top">
      <a class="round-btn" href="../../index.html" data-i18n-aria="hub">🏠</a>
      <h1 class="logo">
        <span class="l1" data-i18n="logo1"></span>
        <span class="l2" data-i18n="logo2"></span>
        <span class="nowrap"><span class="l3" id="logoName"></span> <span class="logo-treat" data-treat aria-hidden="true"></span></span>
      </h1>
      <div class="settings">
        <button class="chip" id="btnSound" type="button"></button>
        <button class="chip" id="btnBuddy" type="button"></button>
        <button class="chip" id="btnLang" type="button"></button>
      </div>
    </header>

    <div class="home-grid">
      <div class="hero">
        <div class="mascot-wrap big" id="mascotHome">
          <div class="bubble" id="bubbleHome" aria-live="polite"></div>
        </div>
        <div class="hero-cards">
          <div class="card basket-card">
            <div class="basket" aria-hidden="true">🧺<span class="basket-treat" data-treat></span></div>
            <div>
              <div class="basket-label" id="basketLabel"></div>
              <div class="basket-count" id="basketCount">0</div>
            </div>
          </div>
          <div class="card rank-card">
            <div class="rank-title" id="rankTitle"></div>
            <div class="rank-stars"><span id="rankStars">0</span> / 30 ⭐</div>
            <div class="rank-bar"><div id="rankFill"></div></div>
            <div class="rank-next" id="rankNext"></div>
          </div>
        </div>
      </div>

      <div class="main-col">
        <h2 class="pick" data-i18n="pickTable"></h2>
        <div class="tables" id="tableGrid"></div>

        <div class="modes card">
          <div class="modes-title" id="selTitle"></div>
          <div class="mode-row">
            <button class="mode" id="btnLearn" type="button"><span class="mode-emoji">📖</span><b data-i18n="learn"></b><small id="learnHint"></small></button>
            <button class="mode" id="btnPractice" type="button"><span class="mode-emoji">✏️</span><b data-i18n="practice"></b><small data-i18n="practiceHint"></small></button>
            <button class="mode pro" id="btnPro" type="button"><span class="mode-emoji" id="proEmoji">🔒</span><b data-i18n="pro"></b><small id="proHint"></small></button>
          </div>
        </div>

        <div class="rush card">
          <div class="rush-head">
            <span class="rush-emoji" aria-hidden="true">⚡</span>
            <div>
              <div class="rush-title" data-i18n="rushTitle"></div>
              <div class="rush-hint" data-i18n="rushHint"></div>
            </div>
          </div>
          <div class="rush-row">
            <button class="btn primary rush-btn" id="btnRushOne" type="button"><span id="rushOneLabel"></span><small id="rushOneBest"></small></button>
            <button class="btn rush-btn" id="btnRushAll" type="button"><span data-i18n="rushAll"></span><small id="rushAllBest"></small></button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- LEARN -->
  <section id="learn" class="screen">
    <header class="top game-top">
      <button class="round-btn" id="learnBack" type="button" data-i18n-aria="back">⬅️</button>
      <div class="game-title" id="learnTitle"></div>
      <button class="round-btn" id="btnSpeak" type="button" data-i18n-aria="readAloud">🗣️</button>
    </header>
    <div class="learn-body">
      <div class="skip" aria-hidden="true"><span class="skip-label" data-i18n="skipLabel"></span><div class="skip-row" id="skipRow"></div></div>
      <div class="card learn-card">
        <div class="groups-label" id="groupsLabel"></div>
        <div class="array" id="learnArray" aria-hidden="true"></div>
        <div class="equation" id="learnEq" aria-live="polite"></div>
      </div>
      <div class="learn-nav">
        <button class="btn nav-btn" id="learnPrev" type="button"><span aria-hidden="true">◀</span> <span data-i18n="prev"></span></button>
        <div class="learn-step" id="learnStep"></div>
        <button class="btn primary nav-btn" id="learnNext" type="button"><span data-i18n="next"></span> <span aria-hidden="true">▶</span></button>
      </div>
      <button class="btn primary learn-done" id="learnPractice" type="button" data-i18n="learnDone" hidden></button>
    </div>
    <div class="mascot-wrap small corner" id="mascotLearn">
      <div class="bubble" id="bubbleLearn"></div>
    </div>
  </section>

  <!-- PLAY (practice, pro, rush) -->
  <section id="play" class="screen">
    <header class="top game-top">
      <button class="round-btn" id="playBack" type="button" data-i18n-aria="back">⬅️</button>
      <div class="game-title" id="playTitle"></div>
      <div class="pill treat-pill" id="treatPill" role="status"><span data-treat aria-hidden="true"></span> <span id="treatNow" aria-hidden="true">0</span></div>
    </header>
    <div class="dots" id="dots" role="progressbar" aria-valuemin="0" aria-valuemax="10"></div>
    <div class="timer" id="timer" hidden>
      <div class="timer-bar"><div id="timerFill"></div></div>
      <div class="timer-text" id="timerText" role="timer"></div>
      <div class="pill score-pill">⭐ <span id="rushScore">0</span></div>
    </div>
    <div class="play-body">
      <div class="streak" id="streak" aria-hidden="true"></div>
      <div class="card q-card" id="qCard">
        <div class="question" id="question" aria-live="assertive"></div>
        <div class="hint" id="hint" hidden>
          <div class="array small" id="hintArray" aria-hidden="true"></div>
          <div class="hint-line" id="hintLine"></div>
        </div>
      </div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
      <div class="choices" id="choices"></div>
      <div class="pad" id="pad" hidden>
        <div class="pad-display" id="padDisplay" aria-live="polite"></div>
        <div class="pad-keys" id="padKeys"></div>
      </div>
      <button class="btn primary got-it" id="btnGotIt" type="button" data-i18n="gotIt" hidden></button>
    </div>
    <div class="mascot-wrap small corner" id="mascotPlay">
      <div class="bubble" id="bubblePlay"></div>
    </div>
  </section>

  <!-- RESULTS -->
  <section id="results" class="screen">
    <div class="result-card card">
      <div class="mascot-wrap big" id="mascotResult">
        <div class="bubble" id="bubbleResult"></div>
      </div>
      <div class="big-stars" id="bigStars" role="img">
        <span>★</span><span>★</span><span>★</span>
      </div>
      <div class="big-score" id="bigScore" hidden></div>
      <div class="result-line" id="resultLine" aria-live="polite"></div>
      <div class="result-sub" id="resultSub"></div>
      <div class="badges" id="badges"></div>
      <div class="result-actions">
        <button class="btn primary" id="btnAgain" type="button" data-i18n="playAgain"></button>
        <button class="btn" id="btnTables" type="button" data-i18n="tables"></button>
      </div>
    </div>
  </section>

  <script src="../../shared/storage.js"></script>
  <script src="../../shared/i18n.js"></script>
  <script src="../../shared/audio.js"></script>
  <script src="../../shared/fx.js"></script>
  <script src="../../shared/mascot.js"></script>
  <script src="../../shared/mascots/pipo.js"></script>
  <script src="../../shared/mascots/bollo.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
