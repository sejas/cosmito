<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sing with Pipo 3D</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎤</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../../shared/base.css" />
  <link rel="stylesheet" href="../../kit/ui.css" />
  <link rel="stylesheet" href="sing3d.css" />
  <link rel="modulepreload" href="../../../vendor/three/three.module.min.js" />
  <script type="importmap">
    { "imports": { "three": "../../../vendor/three/three.module.min.js", "three/addons/": "../../../vendor/three/addons/" } }
  </script>
</head>
<body data-mode="pick">
  <nav class="kit-hud sing-hud">
    <a class="kit-chip" href="../../index.html" data-i18n="home" data-i18n-aria="homeLabel"></a>
    <button class="kit-chip" id="btnBuddy" type="button"></button>
    <button class="kit-chip" id="btnLang" type="button"></button>
    <button class="kit-chip" id="btnSound" type="button"></button>
    <a class="kit-chip" href="../../../games/sing/" data-i18n="classic" data-i18n-aria="classicLabel"></a>
  </nav>

  <!-- song picker: the song buttons are pinned under the floating records -->
  <h2 class="sr-only" data-i18n="pickSong"></h2>
  <div id="songList" class="song-list"></div>
  <section id="pickPanel" class="kit-glass sing-panel pick-panel sing-ui">
    <div class="pp-row">
      <h1 class="pp-title" id="gameTitle"></h1>
      <span class="pp-count" id="starCount"></span>
    </div>
    <div class="pp-rank">
      <strong id="rankTitle"></strong>
      <div id="rankBarHost" class="pp-bar"></div>
      <span class="pp-next" id="rankNext"></span>
    </div>
    <div class="pp-settings">
      <button class="kit-chip" id="btnSpeed" type="button"></button>
      <button class="kit-chip" id="btnGuide" type="button"></button>
      <button class="kit-chip" id="btnNames" type="button"></button>
    </div>
  </section>

  <!-- while singing -->
  <header id="playHud" class="play-hud sing-ui">
    <button class="kit-chip play-back" id="btnBack" type="button" data-i18n="back" data-i18n-aria="backLabel"></button>
    <div class="kit-glass play-title" id="playTitle"></div>
    <div class="kit-glass score-pill" id="scorePill" aria-live="polite">⭐ <span id="score">0</span></div>
    <div class="play-progress" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-i18n-aria="progressLabel">
      <div class="play-progress-fill" id="progressFill"></div>
      <span class="play-progress-buddy" id="progressBuddy" aria-hidden="true"></span>
      <span class="play-progress-flag" aria-hidden="true">🏁</span>
    </div>
  </header>
  <div id="lyrics" class="kit-glass lyrics sing-ui" aria-hidden="true"></div>

  <!-- results -->
  <section id="resultsPanel" class="kit-glass sing-panel results-panel sing-ui" aria-live="polite">
    <p class="rp-stars" id="resultStars" aria-hidden="true"></p>
    <p class="rp-line" id="resultLine"></p>
    <div class="rp-actions">
      <button class="kit-btn primary" id="btnAgain" type="button" data-i18n="again"></button>
      <button class="kit-btn" id="btnSongs" type="button" data-i18n="songs"></button>
    </div>
  </section>

  <script src="../../../shared/storage.js"></script>
  <script src="../../../shared/i18n.js"></script>
  <script src="../../../shared/audio.js"></script>
  <script src="../../../shared/fx.js"></script>
  <script src="../../../shared/mascot.js"></script>
  <script src="../../../shared/mascots/pipo.js"></script>
  <script src="../../../shared/mascots/bollo.js"></script>
  <!-- the 2D game's pure logic: YIN pitch detection and the song book -->
  <script src="../../../games/sing/js/pitch.js"></script>
  <script src="../../../games/sing/js/songs.js"></script>
  <script type="module" src="sing3d.js"></script>
</body>
</html>
