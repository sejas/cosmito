<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Code 3D</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧩</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../../shared/base.css" />
  <link rel="stylesheet" href="../../kit/ui.css" />
  <link rel="stylesheet" href="code3d.css" />
  <link rel="modulepreload" href="../../../vendor/three/three.module.min.js" />
  <script type="importmap">
    { "imports": { "three": "../../../vendor/three/three.module.min.js", "three/addons/": "../../../vendor/three/addons/" } }
  </script>
</head>
<body class="mode-map">
  <nav class="kit-hud c3-head">
    <a class="kit-chip c3-home" id="btnHome" href="../../index.html" data-i18n-aria="homeLabel"><span aria-hidden="true">🏝️</span><span class="c3-wide-only" data-i18n="home"></span></a>
    <button class="kit-chip c3-back" id="btnBack" type="button" data-i18n-aria="back"><span aria-hidden="true">🗺️</span><span class="c3-wide-only" data-i18n="map"></span></button>
    <button class="kit-chip" id="btnBuddy" type="button"></button>
    <button class="kit-chip" id="btnLang" type="button"></button>
    <button class="kit-chip" id="btnSound" type="button"></button>
    <a class="kit-chip" id="btnClassic" href="../../../games/code/" data-i18n-aria="classicLabel"><span data-i18n="classicShort"></span></a>
  </nav>

  <!-- MAP HUD -->
  <section class="c3-maphud" id="mapHud">
    <h1 class="kit-glass c3-worldtitle" id="worldTitle" aria-live="polite">
      <span class="c3-wicon" id="worldIcon" aria-hidden="true"></span>
      <span class="c3-wtext"><span class="c3-wname" id="worldName"></span><span class="c3-wabout" id="worldAbout"></span></span>
      <span class="c3-wstars" id="worldStars"></span>
    </h1>
    <div class="kit-glass c3-worldbar" id="worldBar" role="group" data-i18n-aria="worldsLabel">
      <button class="c3-arrow" id="btnPrevWorld" type="button" data-i18n-aria="prevWorld"><span aria-hidden="true">◀</span></button>
      <div class="c3-tabs" id="worldTabs"></div>
      <button class="c3-arrow" id="btnNextWorld" type="button" data-i18n-aria="nextWorld"><span aria-hidden="true">▶</span></button>
      <div class="c3-total" id="totalStars" aria-live="polite"></div>
    </div>
  </section>

  <!-- PLAY HUD -->
  <section class="c3-playhud" id="playHud" hidden>
    <div class="c3-playbar">
      <div class="kit-glass c3-leveltitle" id="playTitle"></div>
      <button class="c3-hintbtn" id="btnHint" type="button" data-i18n-aria="hint"><span aria-hidden="true">💡</span></button>
    </div>
    <div class="kit-glass c3-dock" id="dock">
      <div class="c3-palette" id="palette" role="group" data-i18n-aria="palette"></div>
      <div class="c3-progwrap">
        <div class="c3-meter" id="meter" role="status"></div>
        <div class="c3-program" id="program" role="group" data-i18n-aria="program"></div>
      </div>
      <div class="c3-controls">
        <button class="c3-ctl" id="btnUndo" type="button" data-i18n-aria="undo"><span aria-hidden="true">↩️</span></button>
        <button class="c3-ctl" id="btnClear" type="button" data-i18n-aria="clear"><span aria-hidden="true">🗑️</span></button>
        <button class="c3-ctl stop" id="btnStop" type="button" data-i18n-aria="stop" hidden><span aria-hidden="true">⏹</span></button>
        <button class="c3-ctl" id="btnSpeed" type="button"></button>
        <button class="c3-ctl" id="btnStep" type="button" data-i18n-aria="step"><span aria-hidden="true">👣</span></button>
        <button class="c3-run" id="btnRun" type="button" data-i18n-aria="run"><span aria-hidden="true" id="runIcon">▶</span></button>
      </div>
    </div>
  </section>

  <!-- WIN -->
  <div class="c3-win" id="win" role="dialog" aria-modal="true" aria-labelledby="winTitle" hidden>
    <div class="kit-glass kit-holo-edge c3-wincard">
      <h2 class="c3-wintitle" id="winTitle" data-i18n="winTitle"></h2>
      <div class="c3-winstars" id="winStars" role="img"><span>★</span><span>★</span><span>★</span></div>
      <div class="c3-winline" id="winLine"></div>
      <div class="c3-winactions">
        <button class="kit-btn" id="btnReplay" type="button" data-i18n-aria="replay"><span aria-hidden="true">↺</span></button>
        <button class="kit-btn" id="btnMap" type="button" data-i18n-aria="map"><span aria-hidden="true">🗺️</span></button>
        <button class="kit-btn primary" id="btnNext" type="button"><span data-i18n="next"></span> <span aria-hidden="true">▶</span></button>
      </div>
    </div>
  </div>

  <div class="c3-fade" id="fade" aria-hidden="true"></div>
  <div class="sr-only" id="live" aria-live="polite"></div>

  <script src="../../../shared/storage.js"></script>
  <script src="../../../shared/i18n.js"></script>
  <script src="../../../shared/audio.js"></script>
  <script src="../../../shared/fx.js"></script>
  <script src="../../../shared/mascot.js"></script>
  <script src="../../../shared/mascots/pipo.js"></script>
  <script src="../../../shared/mascots/bollo.js"></script>
  <script src="../../../games/code/js/i18n.js"></script>
  <script src="../../../games/code/js/engine.js"></script>
  <script src="../../../games/code/js/levels.js"></script>
  <script type="module" src="code3d.js"></script>
</body>
</html>
